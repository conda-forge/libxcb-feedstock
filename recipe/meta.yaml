{% set xorg_name = "libxcb" %}
{% set xorg_category = "lib" %}
{% set name = "libxcb" %}
{% set version = "1.17.0" %}
{% set sha256 = "2c69287424c9e2128cb47ffe92171e10417041ec2963bceafb65cb3fcf8f0b85" %}
{% set am_version = "1.15" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://xorg.freedesktop.org/archive/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - windows.patch  # [win and not arm64]
    - native-clang.patch  # [win and arm64]

build:
  number: 3
  detect_binary_files_with_prefix: true
  run_exports:
    - {{ pin_subpackage('libxcb', max_pin='x') }}

requirements:
  build:
    - python                        # [build_platform != target_platform and not (win and arm64)]
    - python >=3.14                 # [win and arm64]
    - xcb-proto {{ version }}       # [build_platform != target_platform or (win and arm64)]
    # Keep the x64 MinGW toolchain; ARM64 uses native Clang with the MSVC runtime.
    - {{ stdlib("c") }}
    - {{ compiler("c") }}
    - m2-autoconf                   # [win and not arm64]
    - m2-automake{{ am_version }}   # [win and not arm64]
    - m2-libtool                    # [win and not arm64]
    - pkg-config                    # [unix or arm64]
    - xorg-util-macros               # [win and arm64]
    - m2-pkg-config                 # [win and not arm64]
    - gnuconfig                     # [unix or arm64]
    - m2-base                       # [win]
    - make                          # [unix]
    - m2-make                       # [win]
    - autoconf                      # [unix]
    - automake                      # [unix]
    - gettext                       # [unix]
    - libtool                       # [unix]
  host:
    - winpthreads                   # [win and arm64]
    - pthread-stubs
    - xorg-libxau
    - xorg-libxdmcp
    - xorg-util-macros              # [not (win and arm64)]
    - xcb-proto {{ version }}       # [not (win and arm64)]
    - xorg-xorgproto
  run:
    - libwinpthread                 # [win and arm64]
    - winpthreads                   # [win and arm64]
    - xorg-xorgproto                # [win and arm64]
    - pthread-stubs
    - xorg-libxau
    - xorg-libxdmcp

test:
  commands:
    - test -f $PREFIX/lib/libxcb.dylib  # [osx]
    - test -f $PREFIX/lib/libxcb.so  # [linux]
    - if not exist %PREFIX%/Library/lib/libxcb.dll.a exit /b 1  # [win and not arm64]
    - if not exist %PREFIX%/Library/bin/msys-xcb-*.dll exit /b 1  # [win and not arm64]
    - test -f $PREFIX/lib/libxcb-composite.dylib  # [osx]
    - test -f $PREFIX/lib/libxcb-composite.so  # [linux]
    - if not exist %PREFIX%/Library/lib/libxcb-composite.dll.a exit /b 1  # [win and not arm64]
    - if not exist %PREFIX%/Library/bin/msys-xcb-composite-*.dll exit /b 1  # [win and not arm64]
    - test -f $PREFIX/lib/libxcb-damage.dylib  # [osx]
    - test -f $PREFIX/lib/libxcb-damage.so  # [linux]
    - if not exist %PREFIX%/Library/lib/libxcb-damage.dll.a exit /b 1  # [win and not arm64]
